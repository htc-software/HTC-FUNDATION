name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    env:
      APP_DIR: /var/www/nextjs-app
      APP_NAME: nextjs-app
      NODE_VERSION: 22

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Create runtime archive
        run: |
          set -euo pipefail

          runtime_dir="$RUNNER_TEMP/runtime"
          mkdir -p "$runtime_dir/.next"

          cp -a .next/standalone/. "$runtime_dir/"
          cp -a .next/static "$runtime_dir/.next/static"
          cp -a public "$runtime_dir/public"

          tar -czf "$RUNNER_TEMP/runtime.tar.gz" -C "$runtime_dir" .

      - name: Setup SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          key_file="$HOME/.ssh/id_rsa"

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" | perl -pe 's/\\n/\n/g; s/\r//g' > "$key_file"
          if ! grep -q 'BEGIN .*PRIVATE KEY' "$key_file"; then
            printf '%s' "$EC2_SSH_PRIVATE_KEY" | tr -d '\r\n ' | base64 -d > "$key_file" 2>/dev/null || true
          fi

          chmod 600 ~/.ssh/id_rsa
          if ! ssh-keygen -y -f "$key_file" > /dev/null; then
            echo "::error::EC2_SSH_PRIVATE_KEY must be an unencrypted SSH private key, either pasted with BEGIN/END PRIVATE KEY lines or base64-encoded from the key file."
            exit 1
          fi
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          set -euo pipefail

          SSH_OPTS="-i ~/.ssh/id_rsa -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          scp $SSH_OPTS "$RUNNER_TEMP/runtime.tar.gz" ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/${APP_NAME}-runtime.tar.gz

          ssh $SSH_OPTS ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -euo pipefail

            APP_DIR=/var/www/nextjs-app
            APP_NAME=nextjs-app
            ARCHIVE=/tmp/${APP_NAME}-runtime.tar.gz
            RELEASE_DIR=/tmp/${APP_NAME}-release

            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
            rm -f "$ARCHIVE"

            sudo mkdir -p "$APP_DIR"
            sudo rsync -a --delete --exclude='.env.local' "$RELEASE_DIR"/ "$APP_DIR"/
            sudo chown -R "$(id -u):$(id -g)" "$APP_DIR"
            rm -rf "$RELEASE_DIR"

            cd "$APP_DIR"

            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 delete "$APP_NAME"
            fi

            PORT=3000 HOSTNAME=0.0.0.0 pm2 start server.js --name "$APP_NAME" --time
            pm2 save

            for attempt in $(seq 1 10); do
              if curl -fsS --max-time 15 http://127.0.0.1:3000/ > /dev/null; then
                break
              fi

              if [ "$attempt" -eq 10 ]; then
                pm2 logs "$APP_NAME" --lines 80 --nostream
                exit 1
              fi

              sleep 2
            done

            pm2 list
          ENDSSH

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Application is running on port 3000"

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          rm -f "$RUNNER_TEMP/runtime.tar.gz"
