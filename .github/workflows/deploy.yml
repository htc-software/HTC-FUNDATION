name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Change to your desired branch

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env.local' \
            -czf "$RUNNER_TEMP/source.tar.gz" \
            -C "$GITHUB_WORKSPACE" \
            .

      - name: Setup SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          key_file="$HOME/.ssh/id_rsa"

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" | perl -pe 's/\\n/\n/g; s/\r//g' > "$key_file"
          if ! grep -q 'BEGIN .*PRIVATE KEY' "$key_file"; then
            printf '%s' "$EC2_SSH_PRIVATE_KEY" | tr -d '\r\n ' | base64 -d > "$key_file" 2>/dev/null || true
          fi

          chmod 600 ~/.ssh/id_rsa
          if ! ssh-keygen -y -f "$key_file" > /dev/null; then
            echo "::error::EC2_SSH_PRIVATE_KEY must be an unencrypted SSH private key, either pasted with BEGIN/END PRIVATE KEY lines or base64-encoded from the key file."
            exit 1
          fi
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          # Transfer source archive
          scp -i ~/.ssh/id_rsa "$RUNNER_TEMP/source.tar.gz" ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/source.tar.gz

          # Execute deployment commands on EC2
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            
            # Navigate to application directory
            cd /var/www/nextjs-app
            
            # Extract source archive
            tar -xzf /tmp/source.tar.gz
            rm /tmp/source.tar.gz
            
            # Install dependencies
            echo "Installing dependencies..."
            npm ci
            
            # Build Next.js application
            echo "Building Next.js application..."
            NODE_ENV=production npm run build
            
            # Restart application with PM2
            if pm2 describe nextjs-app > /dev/null 2>&1; then
              echo "Restarting existing PM2 process..."
              pm2 restart nextjs-app
            else
              echo "Starting new PM2 process..."
              pm2 start npm --name "nextjs-app" -- start
              pm2 save
            fi
            
            # Verify PM2 status
            pm2 list
          ENDSSH

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Application should be running on port 3000"

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          rm -f "$RUNNER_TEMP/source.tar.gz"
