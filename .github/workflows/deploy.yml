name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Change to your desired branch

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create source archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env.local' \
            -czf "$RUNNER_TEMP/source.tar.gz" \
            -C "$GITHUB_WORKSPACE" \
            .

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Check EC2 connectivity
        run: |
          echo "Testing TCP connectivity to ${{ secrets.EC2_HOST }}:22 ..."
          if ! nc -zv -w 15 "${{ secrets.EC2_HOST }}" 22; then
            echo "::error::Cannot reach EC2 host on port 22."
            echo "::error::Go to AWS Console → EC2 → Instances and verify:"
            echo "::error::  1) The instance is in state 'running'"
            echo "::error::  2) Security Group has inbound rule: SSH (22) from 0.0.0.0/0"
            echo "::error::  3) The EC2_HOST secret matches the current Public IP/DNS"
            exit 1
          fi
          echo "EC2 is reachable on port 22."

      - name: Add EC2 host to known_hosts
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 30 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts || true

      - name: SSH diagnostics
        run: |
          echo "EC2_HOST: ${{ secrets.EC2_HOST }}"
          echo "DNS/IP resolution (getent hosts):"
          getent hosts "${{ secrets.EC2_HOST }}" || true
          echo "Attempting SSH handshake (verbose, timeout 20s)..."
          timeout 20 ssh -vvv \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            'echo ok' || true

      - name: Deploy to EC2
        run: |
          # Transfer source archive
          for i in 1 2 3; do
            echo "SCP attempt $i/3..."
            scp \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "$RUNNER_TEMP/source.tar.gz" \
              ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/source.tar.gz && break
            sleep 5
          done

          # Execute deployment commands on EC2
          ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e

            echo "Node version: $(node -v || true)"
            echo "NPM version: $(npm -v || true)"
            echo "PM2 version: $(pm2 -v || true)"

            APP_DIR=/var/www/nextjs-app
            
            # Ensure the application directory exists, then extract with elevated permissions.
            sudo mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            
            # Extract source archive
            sudo tar --no-same-owner --overwrite -xzf /tmp/source.tar.gz
            rm /tmp/source.tar.gz

            # Ensure the remote user owns the app directory (avoid npm/root permission issues)
            sudo chown -R "$(whoami):$(whoami)" "$APP_DIR"
            
            # Install dependencies
            echo "Installing dependencies..."
            npm ci
            
            # Build Next.js application
            echo "Building Next.js application..."
            env NODE_ENV=production npm run build
            
            # Restart application with PM2
            if pm2 describe nextjs-app > /dev/null 2>&1; then
              echo "Restarting existing PM2 process..."
              pm2 restart nextjs-app
            else
              echo "Starting new PM2 process..."
              pm2 start npm --name "nextjs-app" -- start
              pm2 save
            fi
            
            # Verify PM2 status
            pm2 list
          ENDSSH

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Application should be running on port 3000"

      - name: Cleanup
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/source.tar.gz"
