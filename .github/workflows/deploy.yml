name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Change to your desired branch

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create source archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env.local' \
            -czf "$RUNNER_TEMP/source.tar.gz" \
            -C "$GITHUB_WORKSPACE" \
            .

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          # Transfer source archive
          scp -o StrictHostKeyChecking=yes "$RUNNER_TEMP/source.tar.gz" ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/source.tar.gz

          # Execute deployment commands on EC2
          ssh -o StrictHostKeyChecking=yes ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e

            echo "Node version: $(node -v || true)"
            echo "NPM version: $(npm -v || true)"
            echo "PM2 version: $(pm2 -v || true)"

            APP_DIR=/var/www/nextjs-app
            
            # Ensure the application directory exists, then extract with elevated permissions.
            sudo mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            
            # Extract source archive
            sudo tar --no-same-owner --overwrite -xzf /tmp/source.tar.gz
            rm /tmp/source.tar.gz

            # Ensure the remote user owns the app directory (avoid npm/root permission issues)
            sudo chown -R "$(whoami):$(whoami)" "$APP_DIR"
            
            # Install dependencies
            echo "Installing dependencies..."
            npm ci
            
            # Build Next.js application
            echo "Building Next.js application..."
            env NODE_ENV=production npm run build
            
            # Restart application with PM2
            if pm2 describe nextjs-app > /dev/null 2>&1; then
              echo "Restarting existing PM2 process..."
              pm2 restart nextjs-app
            else
              echo "Starting new PM2 process..."
              pm2 start npm --name "nextjs-app" -- start
              pm2 save
            fi
            
            # Verify PM2 status
            pm2 list
          ENDSSH

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Application should be running on port 3000"

      - name: Cleanup
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/source.tar.gz"
